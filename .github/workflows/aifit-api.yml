name: AIFit API CI/CD

on:
  pull_request:
    paths:
      - "api/**"
      - "deploy/compose.prod.yml"
      - "deploy/aifit-api-deploy"
      - "deploy/known_hosts"
      - ".github/workflows/aifit-api.yml"
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "deploy/compose.prod.yml"
      - "deploy/aifit-api-deploy"
      - "deploy/known_hosts"
      - ".github/workflows/aifit-api.yml"

permissions:
  contents: read

concurrency:
  group: aifit-api-production
  cancel-in-progress: false

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked --extra test
        working-directory: api
      - run: uv run --frozen pytest -q
        working-directory: api

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: api-tests
    runs-on: [self-hosted, linux, x64, aifit]
    timeout-minutes: 10
    environment: production
    steps:
      - name: Deploy from main
        run: sudo /usr/local/sbin/aifit-api-deploy
