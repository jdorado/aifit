[project]
name = "aifit-api"
version = "0.1.0"
description = "The AIFit canonical API: authentication, records, and deterministic workout operations."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=45,<47",
  "fastapi>=0.128,<1",
  "httpx>=0.28,<1",
  "pyjwt>=2.10,<3",
  "pymongo>=4.13,<5",
  "uvicorn[standard]>=0.40,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aifit_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
